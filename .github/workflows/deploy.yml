name: CI/CD DevSecOps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Ejecutar Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: pytest -v

  bandit:
    name: Análisis SAST con Bandit
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Bandit
        run: pip install bandit

      - name: Ejecutar Bandit
        run: bandit -r app -ll

  trivy:
    name: Escaneo de imagen con Trivy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t devsecops-api:${{ github.sha }} .

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  deploy:
    name: Desplegar en EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
      - bandit
      - trivy
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar mediante SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/devsecops-sre
            git pull origin main
            docker compose up -d --build
